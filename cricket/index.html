<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket-game</title>
    <link rel="stylesheet" href="cricket.css">
</head>
<body>
    <h1>Bat,Ball,Stumps Game</h1>
    
    <button class="choice-button" id="bat" onclick="
    console.log('your choice is bat');
     let computerChoice = generateComputerChoice();
     let result = resultMsg('Bat',computerChoice);
     showAlert('Bat',computerChoice,result);
    ">
    <img src="images/bat.png" alt="bat image" class="choice-image">
    </button>


    <button class="choice-button" id="ball" onclick="
        console.log('your choice is ball');
         computerChoice=generateComputerChoice();
         result = resultMsg('Ball',computerChoice);
         showAlert('Ball',computerChoice,result);
    ">
    <img src="images/ball.png" alt="ball image" class="choice-image">
    </button>


    <button class="choice-button" id="stumps" onclick="
        console.log('your choice is Stumps');
        computerChoice=generateComputerChoice();
        result = resultMsg('Stumps',computerChoice);
        showAlert('Stumps',computerChoice,result);
    ">
    <img src="images/stump.png" alt="stump image" class="choice-image">
    </button>

    
    <p id="scoreDisplay"></p>

    <button onclick="localStorage.clear(); resetScore(); document.getElementById('scoreDisplay').textContent = score.displayScore(); alert('Score Reset!');
    ">Reset</button>

<script src="cricket.js"></script>  
</body>
</html>
